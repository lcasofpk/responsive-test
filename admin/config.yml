backend:
  name: github
  repo: lcasofpk/responsive-test
  branch: main
  base_url: https://responsive-test.localcouncilsassociationspk.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  # =====================================
  # NEWS & EVENTS
  # =====================================

  - name: "news"
    label: "News & Events"
    folder: "content/news"
    create: true
    slug: "{{slug}}"

    sortable_fields:
      - "date"
      - "title"
      - "tag"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMMM YYYY"
        time_format: false

      - label: "Type"
        name: "tag"
        widget: "select"
        options:
          - "News"
          - "Event"
          - "Press Release"
          - "Legal Bulletin"
          - "Project Update"
          - "Announcement"
          - "Publication"

      - label: "Short Summary"
        name: "excerpt"
        widget: "text"

      - label: "Featured Image / GIF"
        name: "featuredImage"
        widget: "image"
        required: false
        hint: "Recommended card size: around 800×450 px."

      - label: "Image Alt Text"
        name: "featuredImageAlt"
        widget: "string"
        required: false

      - label: "Permalink"
        name: "permalink"
        widget: "string"
        required: false
        hint: "Leave blank to use the automatic /news/slug/ URL."

      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "news-post.njk"

      - label: "Body"
        name: "body"
        widget: "markdown"

  # =====================================
  # WEBSITE PAGES
  # =====================================

  - name: "pages"
    label: "Website Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - label: "Page Title"
        name: "title"
        widget: "string"

      - label: "Menu Label"
        name: "menuLabel"
        widget: "string"
        required: false
        hint: "Optional. Leave blank to use the Page Title."

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Permalink"
        name: "permalink"
        widget: "string"
        required: false
        hint: "Keep the existing URL when editing an existing page."

      - label: "Parent Menu"
        name: "parent"
        widget: "select"
        required: false
        default: "None"
        options:
          - "None"
          - "About Us"
          - "Our Work"
          - "Advocacy"
          - "Partners"
          - "Resources"

      - label: "Show in Navigation"
        name: "showInNav"
        widget: "boolean"
        default: true

      - label: "Page Content"
        name: "body"
        widget: "markdown"
        modes:
          - "rich_text"
          - "raw"
        buttons:
          - "bold"
          - "italic"
          - "link"
          - "heading-two"
          - "heading-three"
          - "heading-four"
          - "quote"
          - "bulleted-list"
          - "numbered-list"
        editor_components:
          - "image"

  # =====================================
  # DOCUMENT / PDF REPOSITORY
  # =====================================

  - name: "documents"
    label: "Document / PDF Repository"

    files:
      - file: "documents.json"
        name: "documents"
        label: "Documents"

        fields:
          - label: "Documents"
            name: "items"
            widget: "list"

            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Legal Act"
                  - "Toolkit"
                  - "Policy Brief"
                  - "Report"
                  - "Manual"
                  - "Other"

              - label: "Region"
                name: "region"
                widget: "string"
                required: false

              - label: "Link (Google Drive or direct PDF URL)"
                name: "url"
                widget: "string"

  # =====================================
  # LCA TV VIDEOS
  # =====================================

  - name: "videos"
    label: "LCA TV Videos"

    files:
      - file: "videos.json"
        name: "videos"
        label: "YouTube Videos"

        fields:
          - label: "Videos"
            name: "items"
            widget: "list"

            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "YouTube Link or Video ID"
                name: "youtubeId"
                widget: "string"

  # =====================================
  # SOCIAL MEDIA
  # =====================================

  - name: "social"
    label: "Social Media Embeds"

    files:
      - file: "_data/social.json"
        name: "social"
        label: "Social Post Links"

        fields:
          - label: "X (Twitter) Handle"
            name: "twitterHandle"
            widget: "string"
            required: false

          - label: "X (Twitter) Post Text"
            name: "twitterText"
            widget: "text"
            required: false

          - label: "Facebook Post URL"
            name: "facebookPostUrl"
            widget: "string"
            required: false

          - label: "Instagram Post URL"
            name: "instagramPostUrl"
            widget: "string"
            required: false

  # =====================================
  # SITE SETTINGS
  # =====================================

  - name: "site"
    label: "Site Settings"

    files:
      - file: "_data/nav.json"
        name: "navigation"
        label: "Navigation"

        fields:
          - label: "Navigation Items"
            name: "items"
            widget: "list"

            fields:
              - label: "Label"
                name: "label"
                widget: "string"

              - label: "URL"
                name: "url"
                widget: "string"
